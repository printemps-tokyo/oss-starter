name: バグ報告
description: 不具合を報告する
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きたか
      description: 期待した挙動と実際の挙動
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / 環境
      placeholder: "v0.1.0 / Node 22 / macOS"
    validations:
      required: false
